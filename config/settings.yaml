proyecto:
  nombre: "AI Video Factory - Dinero Inteligente"
  nicho: "finanzas_personales"
  idioma: "es"
  # 70s: sigue por encima del minimo de 60s que exigen los in-stream ads de
  # Meta, pero mucho mas cerca del rango donde el algoritmo no castiga. A
  # 120s era casi imposible mantener el % de reproduccion completa.
  duracion_objetivo_segundos: 70
  videos_por_dia: 1

contenido:
  formato: "vertical_9_16"
  resolucion: [1080, 1920]
  fps: 30
  estilo_visual: "cinematic_financial"
  # "panel": imagen al 60% superior y texto en banda oscura abajo, sin solape.
  # Esa banda es la misma zona donde van los graficos de cifras, asi que
  # imagenes y datos comparten una sola reticula. "completa" = como antes.
  maqueta: "panel"
  musica_fondo: true
  # Con ducking la musica puede ir mas alta: baja sola bajo la voz y llena
  # las pausas. A 0.15 fijo practicamente no se oia.
  volumen_musica: 0.35
  elevenlabs_voice_id: "21m00Tcm4TlvDq8ikWAM"
  edge_voice: "es-MX-DaliaNeural"
  # Gemini TTS (gratis) acepta direccion actoral y suena mucho menos plano
  # que edge-tts. Voces: Puck (energico), Kore, Charon, Fenrir, Aoede.
  gemini_voz: "Puck"
  velocidad_voz: 1.2
  disclosure_texto: "Contenido generado con IA"

hook_hablado:
  # El personaje abre el video moviendo los labios (SadTalker, GPU local).
  # Solo afecta a la apertura: el resto sigue con planos fijos y camara.
  # En GitHub Actions no hay GPU, asi que alli no se activa y el video
  # sale igual con la apertura normal.
  activado: true
  segundos: 12          # duracion de la apertura hablada
  tamano: 256           # 256 = diario. 512 = mas nitido, bastante mas lento
  timeout_segundos: 900 # pasado este limite se abandona y sigue el pipeline
  ruta_sadtalker: "D:/LipSyncTools/SadTalker"

intelligence:
  hashtags_descubrimiento:
    - "finanzaspersonales"
    - "educacionfinanciera"
    - "ahorro"
    - "inversiones"
    - "dinero"
    - "independenciafinanciera"
  minimo_vistas: 50000
  dias_atras: 90
  videos_por_hashtag: 50
  top_referentes_descubiertos: 3
  referentes_instagram: []
  whisper_model: "base"
  whisper_device: "cpu"
  score_minimo_publicar: 60
  maximos_reintentos_reescritura: 2
  guiones_por_dia: 3
  dia_actualizacion_matrix: "lunes"
  hora_actualizacion_matrix: "06:00"
  apify_actor: "apify/instagram-scraper"

publicacion:
  activada: false
  plataformas: ["facebook_videos", "instagram_reels"]
  horario_publicacion: "18:00"
  disclosure_ia: true

costos:
  presupuesto_mensual_usd: 50
  alerta_costo_video_usd: 1.50

logging:
  nivel: "INFO"
  archivo: "logs/pipeline.log"
